name: Weekly AI digest

on:
  schedule:
    - cron: "0 13 * * 5"   # Fridays 13:00 UTC = 8am CDT / 7am CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_TO: rowan.flynn@wausaupilotandreview.com, editor@wausaupilotandreview.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python digest.py
      - name: Record what was covered
        run: |
          git config user.name "wpr-ai-digest"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
