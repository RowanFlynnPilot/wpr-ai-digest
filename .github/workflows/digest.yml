name: Weekly AI digest

on:
  schedule:
    - cron: "47 11 * * 5"   # 11:47 UTC = 6:47am CDT / 5:47am CST (off-peak minute: GitHub delays :00 crons by hours)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research + render only; no email, no seen.json commit"
        type: boolean
        default: false

concurrency:
  group: wpr-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_TO: rowan.flynn@wausaupilotandreview.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python digest.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest-preview.html
      - name: Record what was covered
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "wpr-ai-digest"
          git config user.email "actions@users.noreply.github.com"
          git pull --ff-only
          python hub.py
          git add seen.json docs
          git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push
